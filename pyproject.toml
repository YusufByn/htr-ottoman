[project]
name = "htr-ottoman"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kraken==7.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "tensorboard>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# Décision 47 : scipy 1.15.3 (exigé par kraken 7.1.1, scipy~=1.15.3) ne se charge plus sous macOS 27
# (section __thread_bss des modules Fortran refusée par dyld) ; 1.17.1 réécrit PROPACK en C (scipy#25635).
override-dependencies = ["scipy==1.17.1"]
