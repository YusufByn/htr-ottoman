[project]
name = "htr-ottoman"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kraken==7.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "tensorboard>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
